<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flywheel Dev Harness</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel-2: #1b202a; --border: #232936;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff;
    --pending: #d29922; --processing: #3b82f6; --completed: #2f9e63; --failed: #e5534b;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  header h1 { font-size: 15px; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12px; }
  #conn { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #connDot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #connDot.ok { background: var(--completed); }
  #connDot.bad { background: var(--failed); }

  #layout { display: flex; flex: 1; min-height: 0; }

  aside {
    width: 280px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside .pane-top { padding: 10px; border-bottom: 1px solid var(--border); }
  #newThread {
    width: 100%; padding: 8px; border: 1px dashed var(--border); border-radius: 8px;
    background: transparent; color: var(--accent); cursor: pointer; font-weight: 600;
  }
  #newThread:hover { border-color: var(--accent); }
  #threads { list-style: none; overflow-y: auto; flex: 1; padding: 6px; }
  #threads li {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent;
  }
  #threads li:hover { background: var(--panel-2); }
  #threads li.active { background: var(--panel-2); border-color: var(--border); }
  #threads .t-head { display: flex; align-items: center; gap: 6px; }
  #threads .t-id { font-weight: 650; }
  #threads .t-time { margin-left: auto; color: var(--muted); font-size: 11px; }
  #threads .t-snippet {
    color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 2px;
  }
  #threads .t-counts { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .empty { color: var(--muted); text-align: center; padding: 24px 12px; font-size: 13px; }

  #failedPanel { border-top: 1px solid var(--border); flex: none; max-height: 45%; display: flex; flex-direction: column; }
  #failedPanel[hidden] { display: none !important; }
  .failed-head {
    padding: 8px 12px; color: var(--failed); font-weight: 700; font-size: 12px;
    text-transform: uppercase; letter-spacing: .04em; flex: none;
  }
  #failedList { list-style: none; overflow-y: auto; padding: 0 6px 6px; }
  #failedList li {
    padding: 8px 10px; border-radius: 8px; margin-bottom: 4px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--failed) 35%, transparent);
    background: color-mix(in srgb, var(--failed) 7%, transparent);
  }
  #failedList .f-row { display: flex; align-items: center; gap: 6px; }
  #failedList .f-thread { font-weight: 650; }
  #failedList .f-time { margin-left: auto; color: var(--muted); font-size: 11px; }
  #failedList .f-snippet {
    color: var(--text); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 3px;
  }
  #failedList .f-error {
    color: var(--failed); font-size: 11px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 2px;
  }
  #failedList .f-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #failedList .f-attempts { color: var(--muted); font-size: 11px; }
  #failedList .route {
    border: 1px solid color-mix(in srgb, var(--failed) 55%, transparent);
    background: transparent; color: var(--failed); border-radius: 6px;
    padding: 3px 10px; cursor: pointer; font-size: 11px; font-weight: 650;
  }
  #failedList .route:hover { background: color-mix(in srgb, var(--failed) 15%, transparent); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #threadHeader {
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: baseline; gap: 10px; flex: none;
  }
  #threadHeader .hint { color: var(--muted); font-size: 12px; }

  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--panel); }
  .msg.customer { align-self: flex-start; border-left: 3px solid var(--accent); }
  .msg.assistant { align-self: flex-end; border-right: 3px solid var(--completed); background: var(--panel-2); }
  .msg.system { align-self: center; color: var(--muted); }
  .m-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .m-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .m-time { color: var(--muted); font-size: 11px; margin-left: auto; }
  .m-content { white-space: pre-wrap; overflow-wrap: anywhere; }
  .m-foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .m-foot .redeliver {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 11px;
  }
  .m-foot .redeliver:hover { color: var(--text); border-color: var(--muted); }
  .m-foot .tick { color: var(--completed); }
  .m-foot .dispatching { color: var(--muted); }
  .m-tech {
    margin-top: 8px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; white-space: pre; overflow-x: auto;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 650; border: 1px solid;
  }
  .chip.pending    { color: var(--pending);    border-color: color-mix(in srgb, var(--pending) 45%, transparent);    background: color-mix(in srgb, var(--pending) 12%, transparent); }
  .chip.processing { color: var(--processing); border-color: color-mix(in srgb, var(--processing) 45%, transparent); background: color-mix(in srgb, var(--processing) 12%, transparent); }
  .chip.completed  { color: var(--completed);  border-color: color-mix(in srgb, var(--completed) 45%, transparent);  background: color-mix(in srgb, var(--completed) 12%, transparent); }
  .chip.failed     { color: var(--failed);     border-color: color-mix(in srgb, var(--failed) 45%, transparent);     background: color-mix(in srgb, var(--failed) 12%, transparent); }

  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px; flex: none; }
  #composer .row { display: flex; gap: 8px; margin-bottom: 8px; }
  #composer .row:last-child { margin-bottom: 0; }
  #composer input, #composer textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  #composer input:focus, #composer textarea:focus { outline: none; border-color: var(--accent); }
  #customerId { width: 160px; }
  #externalId { flex: 1; }
  #content { flex: 1; resize: none; height: 60px; }
  #send {
    padding: 0 22px; border: none; border-radius: 8px; background: var(--accent);
    color: #fff; font-weight: 650; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  label { color: var(--muted); font-size: 11px; display: block; margin-bottom: 3px; }

  #viewToggle { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; margin-left: 12px; }
  #viewToggle button {
    border: none; background: transparent; color: var(--muted); padding: 4px 12px;
    border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
  }
  #viewToggle button.active { background: var(--panel-2); color: var(--text); }

  #chatView, #dbView, #logsView { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #chatView[hidden], #dbView[hidden], #logsView[hidden] { display: none !important; }

  #logFilters {
    display: flex; gap: 8px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex: none; flex-wrap: wrap;
  }
  #logFilters select, #logFilters input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px;
  }
  #logFilters select:focus, #logFilters input:focus { outline: none; border-color: var(--accent); }
  #logSearch { width: 180px; }
  #logThread { width: 150px; }
  #logMeta { color: var(--muted); font-size: 12px; }
  #logFilters .follow { color: var(--muted); font-size: 12px; display: flex; gap: 5px; align-items: center; margin-left: auto; }
  #logList { flex: 1; overflow: auto; padding: 6px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .log-row {
    display: flex; gap: 8px; align-items: baseline; padding: 3px 4px;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
  }
  .log-time { color: var(--muted); flex: none; }
  .log-lvl { flex: none; width: 44px; font-weight: 700; text-transform: uppercase; font-size: 10px; }
  .log-lvl.debug { color: var(--muted); }
  .log-lvl.info { color: var(--processing); }
  .log-lvl.warn { color: var(--pending); }
  .log-lvl.error { color: var(--failed); }
  .log-event { font-weight: 650; flex: none; }
  .log-fields { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }

  .thread-logs-btn {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 11px; margin-left: auto;
  }
  .thread-logs-btn:hover { color: var(--text); border-color: var(--muted); }

  #dbBar { padding: 7px 16px; border-bottom: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 11px; flex: none; }
  #dbFilters {
    display: flex; gap: 8px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex: none; flex-wrap: wrap;
  }
  #dbFilters select, #dbFilters input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px;
  }
  #dbFilters select:focus, #dbFilters input:focus { outline: none; border-color: var(--accent); }
  #dbThread { width: 170px; }
  #dbFilters .pause { color: var(--muted); font-size: 12px; display: flex; gap: 5px; align-items: center; margin-left: auto; }
  #dbCount { color: var(--muted); font-size: 12px; }
  #dbTableWrap { flex: 1; overflow: auto; }
  #dbTable { border-collapse: collapse; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: nowrap; min-width: 100%; }
  #dbTable th {
    position: sticky; top: 0; background: var(--panel-2); color: var(--muted); text-align: left;
    padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: 650; z-index: 1;
  }
  #dbTable td {
    padding: 5px 10px; border-bottom: 1px solid var(--border);
    max-width: 340px; overflow: hidden; text-overflow: ellipsis;
  }
  #dbTable tbody tr.row { cursor: pointer; }
  #dbTable tbody tr.row:hover td { background: var(--panel); }
  #dbTable .null { color: var(--muted); opacity: .55; font-style: italic; }
  #dbTable tr.detail td { background: var(--bg); white-space: pre-wrap; overflow-wrap: anywhere; max-width: none; }
  #dbTable tr.detail pre { font: inherit; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none;
    box-shadow: 0 6px 24px rgba(0,0,0,.4); max-width: 80vw;
  }
  #toast.warn { border-color: var(--pending); }
  #toast.ok { border-color: var(--completed); }
</style>
</head>
<body>
  <header>
    <h1>Flywheel</h1>
    <span class="sub">dev harness — external platform simulator (ingest &amp; dispatch)</span>
    <nav id="viewToggle">
      <button type="button" data-view="chat" class="active">Conversations</button>
      <button type="button" data-view="db">Database</button>
      <button type="button" data-view="logs">Logs</button>
    </nav>
    <div id="conn"><span id="connDot"></span><span id="connText">connecting…</span></div>
  </header>

  <div id="layout">
    <aside>
      <div class="pane-top"><button id="newThread">+ New thread</button></div>
      <ul id="threads"></ul>
      <div id="failedPanel" hidden>
        <div class="failed-head">⚠ Failed messages</div>
        <ul id="failedList"></ul>
      </div>
    </aside>

    <main>
      <div id="chatView">
      <div id="threadHeader">
        <strong id="threadTitle">No thread selected</strong>
        <span class="hint" id="threadHint">Create a thread and send a message as the customer.</span>
        <button type="button" id="threadLogs" class="thread-logs-btn" hidden title="Open the Logs view filtered to this thread">🪵 logs for this thread</button>
      </div>
      <div id="messages"><div class="empty">Nothing here yet.</div></div>
      <form id="composer">
        <div class="row">
          <div>
            <label for="customerId">customer id (metadata)</label>
            <input id="customerId" value="cust_1" spellcheck="false">
          </div>
          <div style="flex:1">
            <label for="externalId">external message id (optional — reuse one to test webhook-redelivery dedup)</label>
            <input id="externalId" placeholder="auto-generated: ext_<uuid>" spellcheck="false" class="mono">
          </div>
        </div>
        <div class="row">
          <textarea id="content" placeholder="Type a message as the customer… (Enter to send, Shift+Enter for newline)"></textarea>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
      </div>

      <div id="dbView" hidden>
        <div id="dbBar"><span id="dbStats" class="mono">loading…</span></div>
        <div id="dbFilters">
          <select id="dbStatus" title="Filter by status">
            <option value="">all statuses</option>
            <option value="pending">pending</option>
            <option value="processing">processing</option>
            <option value="completed">completed</option>
            <option value="failed">failed</option>
          </select>
          <select id="dbRole" title="Filter by role">
            <option value="">all roles</option>
            <option value="customer">customer</option>
            <option value="assistant">assistant</option>
            <option value="system">system</option>
          </select>
          <input id="dbThread" class="mono" placeholder="thread_id (exact)" spellcheck="false">
          <select id="dbLimit" title="Max rows">
            <option value="50">50 rows</option>
            <option value="200" selected>200 rows</option>
            <option value="1000">1000 rows</option>
          </select>
          <span id="dbCount"></span>
          <label class="pause" title="Freeze auto-refresh while inspecting"><input type="checkbox" id="dbPause"> pause refresh</label>
        </div>
        <div id="dbTableWrap"><table id="dbTable"></table></div>
      </div>

      <div id="logsView" hidden>
        <div id="logFilters">
          <select id="logSource" title="Which process's log file">
            <option value="engine">engine.log</option>
            <option value="dev-ui">dev-ui.log</option>
          </select>
          <select id="logLevel" title="Minimum level">
            <option value="debug">debug +</option>
            <option value="info" selected>info +</option>
            <option value="warn">warn +</option>
            <option value="error">error</option>
          </select>
          <input id="logThread" class="mono" placeholder="threadId (exact)" spellcheck="false" title="Per-thread log view: only entries carrying this threadId">
          <input id="logSearch" placeholder="search text…" spellcheck="false">
          <span id="logMeta"></span>
          <label class="follow" title="Auto-scroll to the newest entries"><input type="checkbox" id="logFollow" checked> follow</label>
        </div>
        <div id="logList"></div>
      </div>
    </main>
  </div>

  <div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = {
  view: "chat",
  active: null,
  threads: [],
  messages: [],
  draftThreads: new Set(),
  lastThreadsJson: "",
  lastMessagesJson: "",
  db: { rows: [], stats: null, expanded: null, lastRowsJson: "", lastStatsJson: "" },
  expandedMessage: null,
  stampedIds: new Set(),
  failed: [],
  lastFailedJson: "",
  logs: { entries: [], lastJson: "", meta: "" },
};

const DB_COLUMNS = [
  "id", "thread_id", "customer_id", "role", "content", "status", "in_reply_to",
  "worker_id", "locked_at", "attempt_count", "error",
  "model", "tokens_in", "tokens_out", "cost_usd", "metadata",
  "sent_to_customer_at", "created_at", "completed_at",
];
const TS_COLUMNS = new Set(["locked_at", "sent_to_customer_at", "created_at", "completed_at"]);

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}

let toastTimer = null;
function toast(text, kind) {
  const el = $("toast");
  el.textContent = text;
  el.className = kind || "";
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 3000);
}

function fmtTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour12: false });
}
function fmtAgo(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h";
}

function chip(status, count) {
  const el = document.createElement("span");
  el.className = "chip " + status;
  el.textContent = count === undefined ? status : count + " " + status;
  return el;
}

function renderThreads() {
  const list = $("threads");
  list.textContent = "";
  const serverIds = new Set(state.threads.map((t) => t.threadId));
  const drafts = [...state.draftThreads].filter((id) => !serverIds.has(id));

  if (state.threads.length === 0 && drafts.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No threads yet.";
    list.appendChild(empty);
    return;
  }

  for (const id of drafts) {
    const li = document.createElement("li");
    if (id === state.active) li.classList.add("active");
    const head = document.createElement("div");
    head.className = "t-head";
    const tid = document.createElement("span");
    tid.className = "t-id mono";
    tid.textContent = id;
    head.appendChild(tid);
    li.appendChild(head);
    const snippet = document.createElement("div");
    snippet.className = "t-snippet";
    snippet.textContent = "draft — no messages yet";
    li.appendChild(snippet);
    li.onclick = () => selectThread(id);
    list.appendChild(li);
  }

  for (const t of state.threads) {
    const li = document.createElement("li");
    if (t.threadId === state.active) li.classList.add("active");

    const head = document.createElement("div");
    head.className = "t-head";
    const tid = document.createElement("span");
    tid.className = "t-id mono";
    tid.textContent = t.threadId;
    const time = document.createElement("span");
    time.className = "t-time";
    time.textContent = fmtAgo(t.lastActivityAt);
    head.append(tid, time);
    li.appendChild(head);

    const snippet = document.createElement("div");
    snippet.className = "t-snippet";
    snippet.textContent = t.lastContent;
    li.appendChild(snippet);

    const counts = document.createElement("div");
    counts.className = "t-counts";
    if (t.pendingCount) counts.appendChild(chip("pending", t.pendingCount));
    if (t.processingCount) counts.appendChild(chip("processing", t.processingCount));
    if (t.completedCount) counts.appendChild(chip("completed", t.completedCount));
    if (t.failedCount) counts.appendChild(chip("failed", t.failedCount));
    li.appendChild(counts);

    li.onclick = () => selectThread(t.threadId);
    list.appendChild(li);
  }
}

function renderMessages() {
  const box = $("messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.textContent = "";

  if (!state.active) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Select or create a thread.";
    box.appendChild(empty);
    return;
  }
  if (state.messages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No messages in " + state.active + " yet — send one below.";
    box.appendChild(empty);
    return;
  }

  for (const m of state.messages) {
    const el = document.createElement("div");
    el.className = "msg " + m.role;
    el.title = "Click for technical details";
    el.onclick = () => {
      state.expandedMessage = state.expandedMessage === m.id ? null : m.id;
      renderMessages();
    };

    const head = document.createElement("div");
    head.className = "m-head";
    const role = document.createElement("span");
    role.className = "m-role";
    role.textContent = m.role;
    head.appendChild(role);
    head.appendChild(chip(m.status));
    if (m.attemptCount > 1) {
      const att = document.createElement("span");
      att.className = "m-time";
      att.textContent = "attempts: " + m.attemptCount;
      head.appendChild(att);
    }
    const time = document.createElement("span");
    time.className = "m-time";
    time.textContent = fmtTime(m.createdAt);
    head.appendChild(time);
    el.appendChild(head);

    const content = document.createElement("div");
    content.className = "m-content";
    content.textContent = m.content;
    el.appendChild(content);

    const foot = document.createElement("div");
    foot.className = "m-foot";
    const idEl = document.createElement("span");
    idEl.className = "mono";
    idEl.title = m.id;
    idEl.textContent = m.id.length > 24 ? m.id.slice(0, 24) + "…" : m.id;
    foot.appendChild(idEl);
    if (m.customerId) {
      const cust = document.createElement("span");
      cust.textContent = "· " + m.customerId;
      foot.appendChild(cust);
    }
    if (m.role === "customer") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "redeliver";
      btn.textContent = "↻ redeliver";
      btn.title = "Simulate at-least-once webhook redelivery: re-ingest this message with the same external id";
      btn.onclick = (e) => {
        e.stopPropagation();
        redeliver(m);
      };
      foot.appendChild(btn);
    }
    if (m.role === "assistant") {
      if (m.inReplyTo) {
        const rel = document.createElement("span");
        rel.className = "mono";
        rel.title = "in_reply_to: " + m.inReplyTo;
        rel.textContent = "↩ " + (m.inReplyTo.length > 16 ? m.inReplyTo.slice(0, 16) + "…" : m.inReplyTo);
        foot.appendChild(rel);
      }
      const tick = document.createElement("span");
      if (m.sentToCustomerAt) {
        tick.className = "tick";
        tick.textContent = "✓ delivered " + fmtTime(m.sentToCustomerAt);
      } else {
        tick.className = "dispatching";
        tick.textContent = "⏳ dispatching…";
      }
      foot.appendChild(tick);
    }
    el.appendChild(foot);

    if (state.expandedMessage === m.id) {
      const tech = document.createElement("div");
      tech.className = "m-tech";
      tech.onclick = (e) => e.stopPropagation();
      tech.textContent = JSON.stringify({
        id: m.id,
        customer_id: m.customerId,
        status: m.status,
        worker_id: m.workerId,
        attempt_count: m.attemptCount,
        in_reply_to: m.inReplyTo,
        locked_at: m.lockedAt && new Date(m.lockedAt).toISOString(),
        created_at: new Date(m.createdAt).toISOString(),
        completed_at: m.completedAt && new Date(m.completedAt).toISOString(),
        sent_to_customer_at: m.sentToCustomerAt && new Date(m.sentToCustomerAt).toISOString(),
        error: m.error,
        model: m.model,
        tokens_in: m.tokensIn,
        tokens_out: m.tokensOut,
        cost_usd: m.costUsd,
        metadata: m.metadata,
      }, null, 2);
      el.appendChild(tech);
    }
    box.appendChild(el);
  }

  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function setView(view) {
  state.view = view;
  $("chatView").hidden = view !== "chat";
  $("dbView").hidden = view !== "db";
  $("logsView").hidden = view !== "logs";
  for (const btn of document.querySelectorAll("#viewToggle button")) {
    btn.classList.toggle("active", btn.dataset.view === view);
  }
}
document.querySelectorAll("#viewToggle button").forEach((btn) => {
  btn.onclick = () => { setView(btn.dataset.view); refresh(); };
});

function fmtBytes(n) {
  if (n === null || n === undefined) return "n/a";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(2) + " MB";
}

function renderDbStats() {
  const s = state.db.stats;
  if (!s) return;
  $("dbStats").textContent =
    s.databasePath + " · journal_mode=" + s.journalMode + " · " + fmtBytes(s.sizeBytes) +
    " · " + s.total + " rows — " +
    s.byStatus.pending + " pending / " + s.byStatus.processing + " processing / " +
    s.byStatus.completed + " completed / " + s.byStatus.failed + " failed";
}

function dbCell(row, col) {
  const td = document.createElement("td");
  const value = row[col];
  if (value === null || value === undefined) {
    const el = document.createElement("span");
    el.className = "null";
    el.textContent = "NULL";
    td.appendChild(el);
    return td;
  }
  const text = String(value);
  td.textContent = text;
  if (TS_COLUMNS.has(col) && typeof value === "number") {
    td.title = new Date(value).toISOString();
  } else if (text.length > 40) {
    td.title = text;
  }
  return td;
}

function renderDbTable() {
  const table = $("dbTable");
  table.textContent = "";

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  for (const col of DB_COLUMNS) {
    const th = document.createElement("th");
    th.textContent = col;
    headRow.appendChild(th);
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (const row of state.db.rows) {
    const tr = document.createElement("tr");
    tr.className = "row";
    for (const col of DB_COLUMNS) tr.appendChild(dbCell(row, col));
    tr.onclick = () => {
      state.db.expanded = state.db.expanded === row.id ? null : row.id;
      renderDbTable();
    };
    tbody.appendChild(tr);

    if (state.db.expanded === row.id) {
      const detail = document.createElement("tr");
      detail.className = "detail";
      const td = document.createElement("td");
      td.colSpan = DB_COLUMNS.length;
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(row, null, 2);
      td.appendChild(pre);
      detail.appendChild(td);
      tbody.appendChild(detail);
    }
  }
  table.appendChild(tbody);
  $("dbCount").textContent = state.db.rows.length + " shown";
}

async function refreshDb() {
  if ($("dbPause").checked) return;
  const params = new URLSearchParams();
  if ($("dbStatus").value) params.set("status", $("dbStatus").value);
  if ($("dbRole").value) params.set("role", $("dbRole").value);
  if ($("dbThread").value.trim()) params.set("thread", $("dbThread").value.trim());
  params.set("limit", $("dbLimit").value);

  const [stats, rows] = await Promise.all([
    api("/api/db/stats"),
    api("/api/db/messages?" + params.toString()),
  ]);
  const statsJson = JSON.stringify(stats);
  if (statsJson !== state.db.lastStatsJson) {
    state.db.lastStatsJson = statsJson;
    state.db.stats = stats;
    renderDbStats();
  }
  const rowsJson = JSON.stringify(rows);
  if (rowsJson !== state.db.lastRowsJson) {
    state.db.lastRowsJson = rowsJson;
    state.db.rows = rows;
    renderDbTable();
  }
}

for (const id of ["dbStatus", "dbRole", "dbThread", "dbLimit"]) {
  $(id).addEventListener("input", () => {
    state.db.lastRowsJson = "";
    refresh();
  });
}

function fmtLogTime(ts) {
  return typeof ts === "string" && ts.length >= 23 ? ts.slice(11, 23) : String(ts ?? "");
}

function renderLogs() {
  const list = $("logList");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.textContent = "";

  if (state.logs.entries.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = state.logs.meta || "No log entries match.";
    list.appendChild(empty);
    $("logMeta").textContent = "";
    return;
  }

  for (const entry of state.logs.entries) {
    const row = document.createElement("div");
    row.className = "log-row";

    const time = document.createElement("span");
    time.className = "log-time";
    time.textContent = fmtLogTime(entry.timestamp);
    row.appendChild(time);

    const lvl = document.createElement("span");
    lvl.className = "log-lvl " + (entry.level || "info");
    lvl.textContent = entry.level || "info";
    row.appendChild(lvl);

    const event = document.createElement("span");
    event.className = "log-event";
    event.textContent = entry.event || "?";
    row.appendChild(event);

    const rest = { ...entry };
    delete rest.timestamp;
    delete rest.level;
    delete rest.event;
    const fields = document.createElement("span");
    fields.className = "log-fields";
    const restJson = JSON.stringify(rest);
    fields.textContent = restJson === "{}" ? "" : restJson;
    row.appendChild(fields);

    list.appendChild(row);
  }
  $("logMeta").textContent = state.logs.meta;
  if ($("logFollow").checked || nearBottom) list.scrollTop = list.scrollHeight;
}

async function refreshLogs() {
  const params = new URLSearchParams();
  params.set("source", $("logSource").value);
  params.set("minLevel", $("logLevel").value);
  if ($("logThread").value.trim()) params.set("thread", $("logThread").value.trim());
  if ($("logSearch").value.trim()) params.set("q", $("logSearch").value.trim());
  params.set("limit", "300");

  const res = await api("/api/logs?" + params.toString());
  const resJson = JSON.stringify(res);
  if (resJson === state.logs.lastJson) return;
  state.logs.lastJson = resJson;
  state.logs.entries = res.entries;
  state.logs.meta = res.missing
    ? "No log file yet at " + res.path + " — start that process first."
    : res.entries.length + " entries · " + $("logSource").value + ".log · " +
      (res.sizeBytes / 1024).toFixed(1) + " KB";
  renderLogs();
}

for (const id of ["logSource", "logLevel", "logThread", "logSearch"]) {
  $(id).addEventListener("input", () => {
    state.logs.lastJson = "";
    refresh();
  });
}

$("threadLogs").onclick = () => {
  if (!state.active) return;
  $("logThread").value = state.active;
  state.logs.lastJson = "";
  setView("logs");
  refresh();
};

function renderFailed() {
  const panel = $("failedPanel");
  const list = $("failedList");
  panel.hidden = state.failed.length === 0;
  list.textContent = "";
  for (const m of state.failed) {
    const li = document.createElement("li");
    li.onclick = () => selectThread(m.threadId);
    li.title = "Open thread " + m.threadId;

    const row = document.createElement("div");
    row.className = "f-row";
    const thread = document.createElement("span");
    thread.className = "f-thread mono";
    thread.textContent = m.threadId;
    const time = document.createElement("span");
    time.className = "f-time";
    time.textContent = fmtAgo(m.createdAt);
    row.append(thread, time);
    li.appendChild(row);

    const snippet = document.createElement("div");
    snippet.className = "f-snippet";
    snippet.textContent = m.content;
    li.appendChild(snippet);

    const error = document.createElement("div");
    error.className = "f-error";
    error.title = m.error || "";
    error.textContent = m.error || "no error recorded";
    li.appendChild(error);

    const actions = document.createElement("div");
    actions.className = "f-actions";
    const attempts = document.createElement("span");
    attempts.className = "f-attempts";
    attempts.textContent = "attempts: " + m.attemptCount;
    const route = document.createElement("button");
    route.type = "button";
    route.className = "route";
    route.textContent = "Route to human";
    route.title = "Acknowledge this failure: assign a human and stamp sent_to_customer_at (spec §3.2)";
    route.onclick = async (e) => {
      e.stopPropagation();
      try {
        const res = await api("/api/messages/" + encodeURIComponent(m.id) + "/failed_ack", { method: "POST" });
        toast(res.acknowledged
          ? "Routed to human — failure acknowledged ✓"
          : "Already acknowledged elsewhere", "ok");
        state.lastFailedJson = "";
        refresh();
      } catch (err) {
        toast("Acknowledge failed: " + err.message, "warn");
      }
    };
    actions.append(attempts, route);
    li.appendChild(actions);
    list.appendChild(li);
  }
}

function selectThread(id) {
  setView("chat");
  state.active = id;
  state.lastMessagesJson = "";
  state.messages = [];
  $("threadTitle").textContent = id;
  $("threadHint").textContent = "";
  $("threadLogs").hidden = false;
  renderThreads();
  renderMessages();
  refresh();
}

async function redeliver(m) {
  try {
    const res = await api("/api/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        threadId: m.threadId,
        content: m.content,
        externalId: m.id,
        customerId: m.customerId || "cust_anon",
      }),
    });
    if (res.inserted) {
      toast("Unexpected: redelivery inserted a NEW row — dedup did not hold!", "warn");
    } else {
      toast("Redelivery deduplicated — no new row (INSERT OR IGNORE) ✓", "ok");
    }
    refresh();
  } catch (err) {
    toast("Redeliver failed: " + err.message, "warn");
  }
}

async function refresh() {
  try {
    const threads = await api("/api/threads");
    const threadsJson = JSON.stringify(threads);
    if (threadsJson !== state.lastThreadsJson) {
      state.lastThreadsJson = threadsJson;
      state.threads = threads;
      renderThreads();
    }
    if (state.view === "chat" && state.active) {
      const messages = await api("/api/threads/" + encodeURIComponent(state.active) + "/messages");
      const messagesJson = JSON.stringify(messages);
      if (messagesJson !== state.lastMessagesJson) {
        state.lastMessagesJson = messagesJson;
        state.messages = messages;
        renderMessages();
      }
      // Dispatcher simulation: rendering a completed reply in the customer's
      // view "delivers" it — stamp sent_to_customer_at exactly once.
      for (const m of messages) {
        if (
          m.role === "assistant" && m.status === "completed" &&
          m.sentToCustomerAt === null && !state.stampedIds.has(m.id)
        ) {
          state.stampedIds.add(m.id);
          api("/api/messages/" + encodeURIComponent(m.id) + "/delivered", { method: "POST" })
            .catch(() => state.stampedIds.delete(m.id));
        }
      }
    }
    if (state.view === "db") {
      await refreshDb();
    }
    if (state.view === "logs") {
      await refreshLogs();
    }
    // Failure poll (spec §3.2): a real platform would poll idx_messages_failed
    // exactly like this, in every state of the UI.
    const failed = await api("/api/failed");
    const failedJson = JSON.stringify(failed);
    if (failedJson !== state.lastFailedJson) {
      state.lastFailedJson = failedJson;
      state.failed = failed;
      renderFailed();
    }
    $("connDot").className = "ok";
    $("connText").textContent = "connected";
  } catch (_err) {
    $("connDot").className = "bad";
    $("connText").textContent = "harness unreachable";
  }
}

$("newThread").onclick = () => {
  const id = "tkt_" + Math.random().toString(36).slice(2, 6);
  state.draftThreads.add(id);
  selectThread(id);
  $("content").focus();
};

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  if (!state.active) {
    toast("Create or select a thread first.", "warn");
    return;
  }
  const content = $("content").value.trim();
  if (!content) return;
  $("send").disabled = true;
  try {
    const res = await api("/api/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        threadId: state.active,
        content,
        customerId: $("customerId").value.trim(),
        externalId: $("externalId").value.trim(),
      }),
    });
    if (!res.inserted) {
      toast("Duplicate external id — deduplicated, no new row ✓", "ok");
    }
    $("content").value = "";
    $("externalId").value = "";
    await refresh();
  } catch (err) {
    toast("Send failed: " + err.message, "warn");
  } finally {
    $("send").disabled = false;
    $("content").focus();
  }
};

$("content").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

setInterval(refresh, 1000);
refresh();
</script>
</body>
</html>
