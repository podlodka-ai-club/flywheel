schema: spec-driven

context: |
  Project: triage — Triage Memory, a support-triage agent that learns from its corrections.

  Concept: A background agent pulls B2B support tickets from GitHub Issues, assigns routing
  (owning team) and severity labels, learns from human label corrections, and demonstrably
  improves on later tickets. It is a *designed experiment*, not a benchmark: "secrets" (facts
  to be learned) are declared in corpus/secrets.yaml; teaching tickets reveal them through
  corrections; exam tickets are built to be unanswerable from ticket text or the wiki, and
  answerable only from accumulated memory. Full design in openspec/concept.md.

  Tech stack: Node 20+, TypeScript, Fastify (backend); React 19 + Vite (frontend);
  PGLite for the episode/eval store in dev/test, PostgreSQL in prod (PostgreSQL syntax,
  portable); git-backed markdown/JSON files for learned memory; Anthropic SDK (model);
  Octokit (GitHub); Vitest + Playwright (tests).

  Architecture boundaries (keep these — they make the experiment valid):
  corpus (authoring, import, lint) · sync (GitHub transport) · agent (context assembly,
  decision) · retrieval (wiki RAG) · memory (files, reflector, curator) · eval (arms,
  scoring, exams) · web (dashboard).

  Two invariants that must never be violated:
  1. Single structured LLM call per ticket — no multi-step orchestration, so behaviour
     differences are attributable to memory, not control flow.
  2. Arms (cold, wiki-rag, warm, warm-no-wiki, amnesia) differ ONLY by which context layers
     are enabled — never fork the agent code per arm. The memory module exposes a narrow
     interface: read(query)→view, apply(deltas), snapshot(), fork(without).

  Data split: PGLite holds what is *recorded* (tickets, runs, decisions, citations,
  outcomes — disposable, rebuildable from corpus); git-backed files hold what is *learned*
  (memory/lessons.md, memory/facts.json — diffable, human-readable, the deliverable).

rules:
  proposal:
    - Tie every change back to the thesis: memory beating static-prompt and wiki-RAG.
    - Respect the two invariants (single LLM call; arms are config, not code paths).
    - All SQL is PostgreSQL syntax, portable between PGLite (dev/test) and Postgres (prod).
